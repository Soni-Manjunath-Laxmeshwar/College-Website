<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SKSVMACET | Content manager</title><link rel="stylesheet" href="styles.css"><style>body{background:#eef3fb}.admin{width:min(880px,calc(100% - 32px));margin:50px auto;background:#fff;padding:38px;box-shadow:0 10px 30px #11284d14}.admin h1{font-family:var(--display);font-size:42px;margin:0 0 10px}.admin p{color:var(--muted)}form{display:grid;gap:14px;margin-top:28px}label{font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.1em;color:var(--ink)}input{padding:13px;border:1px solid var(--line);font:14px var(--body)}.admin button{width:max-content;border:0;cursor:pointer}.status{min-height:20px;color:var(--blue);font-size:13px}.event-row{display:flex;justify-content:space-between;gap:18px;align-items:center;border-top:1px solid var(--line);padding:15px 0}.event-row button{padding:8px 11px;background:#f5e1dc;color:#a13723;font:700 11px var(--sans)}</style></head>
<body><main class="admin"><p class="overline">SKSVMACET content manager</p><h1>Publish a campus update.</h1><p>Add a new event or announcement. It will appear in the homepage banner feed immediately.</p><form id="event-form"><label for="type">Category</label><input id="type" required placeholder="Admissions, Campus update, Student life"><label for="date">Date or label</label><input id="date" required placeholder="18 Feb 2026"><label for="title">Headline</label><input id="title" required placeholder="Your event headline"><label for="link">Link</label><input id="link" placeholder="#events"><label for="action">Button label</label><input id="action" value="Read more"><button class="button button--dark" type="submit">Publish update ↗</button><div class="status" id="status"></div></form><h2>Current updates</h2><div id="events"></div></main><script>
const form=document.querySelector('#event-form'), status=document.querySelector('#status'), list=document.querySelector('#events');
async function load(){const events=await fetch('/api/events').then(r=>r.json());list.innerHTML=events.map(e=>`<div class="event-row"><span><strong>${e.type}</strong> · ${e.date}<br>${e.title}</span><button data-id="${e.id}">Remove</button></div>`).join('')||'<p>No updates yet.</p>';list.querySelectorAll('button').forEach(b=>b.onclick=async()=>{await fetch('/api/events/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});load()})}
form.onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(form));const res=await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});status.textContent=res.ok?'Published successfully.':'Could not publish this update.';if(res.ok){form.reset();document.querySelector('#action').value='Read more';load()}};load();
</script></body></html>
